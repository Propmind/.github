name: PR Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
        description: "Pull request number to review"
      convention_docs:
        required: true
        type: string
        description: "Comma-separated list of convention doc paths the reviewer may consult (e.g., 'AGENTS.md,.github/copilot-instructions.md')"
      service_type:
        required: false
        type: string
        default: ""
        description: "Optional service type hint (e.g., python-fastapi, react-typescript). Agent infers from code if omitted."
      mode:
        required: false
        type: string
        default: "auto"
        description: "Review mode: 'auto' or 'comment'"
      comment_author:
        required: false
        type: string
        default: ""
        description: "GitHub username who requested the review (comment mode only)"
      model:
        required: false
        type: string
        default: "claude-opus-5-5"
        description: "Claude model to use for the review"
      max_turns:
        required: false
        type: number
        default: 80
        description: "Hard cap on agent turns, a safety net well above a normal review. A run that hits it publishes nothing and fails the check."
      dry_run:
        required: false
        type: boolean
        default: false
        description: "Validation mode: write the review to the step summary instead of the PR, and hide the PR discussion and the bot's previous review from the reviewer."
      head_sha:
        required: false
        type: string
        default: ""
        description: "Dry run only: review this commit instead of the PR head, to replay the exact state an earlier review saw."
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      LINEAR_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REPO: ${{ github.repository }}
      CONTEXT_DIR: /tmp/review-context
    steps:
      # Check out the PR head explicitly. On `issue_comment` (the `/review` path)
      # the default ref is the base branch, so the reviewer used to read `main`
      # instead of the code under review.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && inputs.head_sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 0

      # Everything the agent used to fetch with tool calls in its first turns is
      # gathered here instead. Every agent turn re-reads the whole context, so a
      # fact fetched by the shell costs nothing per turn while a fact fetched by a
      # tool call costs one turn plus its share of every turn after it.
      - name: Gather PR context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$CONTEXT_DIR"

          gh pr view "$PR_NUMBER" -R "$REPO" \
            --json number,title,body,url,author,headRefName,baseRefName \
            > "$CONTEXT_DIR/pr.json"
          BASE=$(jq -r .baseRefName "$CONTEXT_DIR/pr.json")
          # Diff against the base commit GitHub records for the PR, not the base
          # branch tip: the branch may be gone (a stacked PR's base deleted after
          # its own merge), or may already contain the PR head (a merge-commit
          # merge), which makes `branch...HEAD` empty.
          BASE_REF=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.sha)
          git fetch --no-tags --quiet origin "$BASE_REF"

          # Lockfiles, snapshots and build output carry no reviewable logic. They
          # stay out of the diff and out of the size that picks the model.
          EXCLUDES=(
            ':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/yarn.lock'
            ':(exclude,glob)**/pnpm-lock.yaml' ':(exclude,glob)**/uv.lock'
            ':(exclude,glob)**/poetry.lock' ':(exclude,glob)**/Pipfile.lock'
            ':(exclude,glob)**/bun.lock' ':(exclude,glob)**/bun.lockb'
            ':(exclude,glob)**/__snapshots__/**' ':(exclude,glob)**/*.snap'
            ':(exclude,glob)**/*.min.js' ':(exclude,glob)**/*.min.css'
            ':(exclude,glob)**/dist/**' ':(exclude,glob)**/*.generated.*'
          )
          RANGE="$BASE_REF...HEAD"

          git diff --numstat "$RANGE" -- . "${EXCLUDES[@]}" > /tmp/numstat.txt
          SIZE=$(awk '$1 != "-" { s += $1 + $2 } END { print s + 0 }' /tmp/numstat.txt)
          FILES=$(wc -l < /tmp/numstat.txt | tr -d ' ')
          SKIPPED=$(git diff --name-only "$RANGE" | grep -vxFf <(awk '{ print $3 }' /tmp/numstat.txt) || true)

          # Split the diff so every part fits in one `Read` call (the tool pages
          # long files, and each page is another turn).
          git diff "$RANGE" -- . "${EXCLUDES[@]}" > /tmp/full.patch
          TOTAL_LINES=$(wc -l < /tmp/full.patch | tr -d ' ')
          MAX_LINES=12000
          head -n "$MAX_LINES" /tmp/full.patch | split -l 1500 -d -a 2 --additional-suffix=.patch - "$CONTEXT_DIR/diff-"
          DIFF_PARTS=$(find "$CONTEXT_DIR" -name 'diff-*.patch' -printf '%f\n' | sort | paste -sd, -)

          # A re-review (`/review` after new pushes) only needs to look closely at
          # what changed since the bot's last review of this PR.
          # In a dry run the previous review is hidden, so the run is judged on
          # its own findings instead of copying the ones it is compared against.
          : > "$CONTEXT_DIR/last-bot-review.json"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate --slurp \
              | jq '[.[][] | select(.user.login | endswith("[bot]")) | select(.body | startswith("## PR Review"))] | last // empty' \
              > "$CONTEXT_DIR/last-bot-review.json" || true
          fi
          LAST_SHA=$(jq -r '.commit_id // empty' "$CONTEXT_DIR/last-bot-review.json" 2>/dev/null || true)
          HAS_DELTA=false
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" != "$(git rev-parse HEAD)" ] \
             && git merge-base --is-ancestor "$LAST_SHA" HEAD 2>/dev/null; then
            git diff "$LAST_SHA..HEAD" -- . "${EXCLUDES[@]}" | head -n 3000 > "$CONTEXT_DIR/delta-since-last-review.patch"
            HAS_DELTA=true
          fi

          # `gh pr checks` exits non-zero while checks are pending or failing, so
          # judge it by its output, not its status.
          CI=$(gh pr checks "$PR_NUMBER" -R "$REPO" --json name,bucket \
                 --jq 'map("\(.name): \(.bucket)") | join(", ")' 2>/dev/null || true)
          CI=${CI:-unknown (not readable by this token)}

          {
            echo "# PR #$PR_NUMBER — $(jq -r .title "$CONTEXT_DIR/pr.json")"
            echo
            echo "- URL: $(jq -r .url "$CONTEXT_DIR/pr.json")"
            echo "- Author: @$(jq -r .author.login "$CONTEXT_DIR/pr.json")"
            echo "- Branch: $(jq -r .headRefName "$CONTEXT_DIR/pr.json") → $BASE"
            echo "- Size: $SIZE lines in $FILES files (lockfiles/generated excluded)"
            echo "- CI: $CI"
            echo "- Diff parts: ${DIFF_PARTS:-none} ($TOTAL_LINES diff lines$( [ "$TOTAL_LINES" -gt "$MAX_LINES" ] && echo "; TRUNCATED at $MAX_LINES — use \`git diff $RANGE -- <path>\` for the rest"))"
            if [ -n "$SKIPPED" ]; then
              echo "- Excluded from diff (lockfiles/generated/binary):"
              while IFS= read -r F; do echo "  - $F"; done <<< "$SKIPPED"
            fi
            echo
            echo "## Commits"
            # shellcheck disable=SC2016 # the backticks are Markdown, not expansion
            git log --reverse --no-merges --format='- `%h` %s' "$BASE_REF..HEAD"
            echo
            echo "## Description"
            jq -r '(.body // "(empty)")[0:8000]' "$CONTEXT_DIR/pr.json"
          } > "$CONTEXT_DIR/pr.md"

          # Human discussion, so the reviewer can honour contested findings, plus
          # the bot's previous review so it does not repeat itself. A dry run
          # hides it: it replays a past state, and later comments would leak how
          # the earlier review's findings turned out.
          {
            echo "# Discussion on PR #$PR_NUMBER"
            echo
            [ "${{ inputs.dry_run }}" = "true" ] && echo "(hidden in dry run)" || gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | select(.user.type != "Bot") | "### @\(.user.login) — \(.created_at)\n\n\(.body[0:3000])\n"' \
              | tail -c 60000 || true
            if [ -s "$CONTEXT_DIR/last-bot-review.json" ]; then
              echo
              echo "## Previous automated review (commit \`${LAST_SHA:0:7}\`)"
              echo
              jq -r '.body[0:12000]' "$CONTEXT_DIR/last-bot-review.json"
            fi
          } > "$CONTEXT_DIR/discussion.md"
          rm -f "$CONTEXT_DIR/pr.json" "$CONTEXT_DIR/last-bot-review.json"

          {
            echo "base=$BASE"
            echo "base_ref=$BASE_REF"
            echo "size_lines=$SIZE"
            echo "has_delta=$HAS_DELTA"
            echo "last_sha=$LAST_SHA"
            echo "diff_parts=$DIFF_PARTS"
          } >> "$GITHUB_OUTPUT"

      - name: Route model by PR size
        id: route
        run: |
          set -euo pipefail
          # M+ PRs go to Opus 5.5: in replays of already-reviewed PRs it found
          # more of the known findings than Sonnet 5 and cost less per review
          # (fewer turns outweigh the higher token price). XS/S PRs (< 200 lines)
          # go to Haiku. Size excludes lockfiles and generated files, so a small
          # change that bumps a dependency no longer lands on the larger model.
          # Caller can override by passing a non-default `model` input.
          TOTAL=${{ steps.context.outputs.size_lines }}
          if [ "${{ inputs.model }}" != "claude-opus-5-5" ]; then
            CHOSEN="${{ inputs.model }}"
            REASON="explicit caller override"
          elif [ "$TOTAL" -lt 200 ]; then
            CHOSEN="claude-haiku-4-5"
            REASON="XS/S size ($TOTAL lines) routed to Haiku"
          else
            CHOSEN="claude-opus-5-5"
            REASON="M+ size ($TOTAL lines) routed to Opus"
          fi
          echo "model=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "🤖 Model: $CHOSEN — $REASON" >&2

      - name: Check Linear availability
        id: check-linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -n "$LINEAR_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Linear issue
        if: steps.check-linear.outputs.available == 'true'
        id: linear
        # This step must never be able to fail the review. It reaches the network
        # and parses a payload it does not control; anything unforeseen in here
        # would otherwise turn the `Review PR` check red on every PR of every repo
        # that calls this workflow. On failure `found` is simply never written and
        # the prompt falls through to "no linked issue" — today's behaviour.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          # This used to start an MCP server from `@linear/mcp-server`, a package
          # that does not exist on npm. Every run logged `"linear": "failed"` and
          # the review's "Linear Alignment" section was written without the agent
          # ever having read the issue. One GraphQL call needs no package, no npx,
          # and no tool permission — and it either works or says so out loud.
          BRANCH=$(gh pr view "${{ inputs.pr_number }}" -R "${{ github.repository }}" \
                     --json headRefName --jq .headRefName 2>/dev/null || true)
          ISSUE_ID=$(printf '%s' "$BRANCH" \
                     | grep -oiE '[A-Za-z]{2,5}-[0-9]+' \
                     | head -1 | tr '[:lower:]' '[:upper:]' || true)

          if [ -z "$ISSUE_ID" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Linear identifier in branch '$BRANCH' — reviewing on code alone."
            exit 0
          fi

          # Look the issue up by team key + number rather than by `issue(id:)`,
          # which wants a UUID. `PMT-1666` → team `PMT`, number `1666`.
          TEAM_KEY=${ISSUE_ID%-*}
          ISSUE_NUM=${ISSUE_ID##*-}
          QUERY=$(jq -n --arg team "$TEAM_KEY" --argjson number "$ISSUE_NUM" '{
            query: "query($team:String!,$number:Float!){issues(filter:{team:{key:{eq:$team}},number:{eq:$number}},first:1){nodes{identifier title description url state{name}}}}",
            variables: {team: $team, number: $number}
          }')
          RESPONSE=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$QUERY" || echo '{}')

          ISSUE=$(echo "$RESPONSE" | jq -c '.data.issues.nodes[0] // empty' 2>/dev/null || true)
          if [ -z "$ISSUE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Linear lookup for $ISSUE_ID returned nothing: $(echo "$RESPONSE" | jq -rc '.errors // "no data"')"
            exit 0
          fi

          # Truncate inside jq rather than piping through `head`: `head` closes the
          # pipe early on a long description, `grep` dies of SIGPIPE, and pipefail
          # would abort the block before the closing delimiter is written — leaving
          # `found=true` next to an empty context.
          # The `grep` guards the sentinel: a description carrying the delimiter on
          # a line of its own would otherwise forge workflow outputs.
          CONTEXT=$(echo "$ISSUE" | jq -r '
            "**\(.identifier) — \(.title)** · state: \(.state.name) · \(.url)\n\n\((.description // "(no description)")[0:6000])"' \
            | { grep -vx 'LINEAR_ISSUE_EOF' || true; })

          {
            echo "found=true"
            echo "context<<LINEAR_ISSUE_EOF"
            printf '%s\n' "$CONTEXT"
            echo "LINEAR_ISSUE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Linear $ISSUE_ID loaded."

      - name: Load review rules from Propmind/.github
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Map caller repo → project fragment
          case "$REPO" in
            Propmind/propmind-core) FRAGMENT="project-api" ;;
            Propmind/control-panel-ui) FRAGMENT="project-control-panel-ui" ;;
            Propmind/boleto-extractor) FRAGMENT="project-boleto-extractor" ;;
            Propmind/consumer-baas) FRAGMENT="project-consumer-baas" ;;
            Propmind/clicksign-worker) FRAGMENT="project-clicksign-worker" ;;
            Propmind/propmind-nfse-emitter) FRAGMENT="project-nfse-emitter" ;;
            *) FRAGMENT="" ;;
          esac

          fetch() {
            gh api "repos/Propmind/.github/contents/review-pr-rules/$1.md" \
              -H "Accept: application/vnd.github.raw"
          }

          COMMON=$(fetch common)
          TEMPLATES=$(fetch templates)
          LARGE_PR=$(fetch large-pr-prioritization)
          if [ -n "$FRAGMENT" ]; then
            PROJECT=$(fetch "$FRAGMENT")
          else
            PROJECT="(Unmapped project — apply common checklist only.)"
          fi

          {
            echo "common<<RULES_EOF"
            echo "$COMMON"
            echo "RULES_EOF"
            echo "templates<<RULES_EOF"
            echo "$TEMPLATES"
            echo "RULES_EOF"
            echo "large_pr<<RULES_EOF"
            echo "$LARGE_PR"
            echo "RULES_EOF"
            echo "project<<RULES_EOF"
            echo "$PROJECT"
            echo "RULES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run semgrep pre-pass
        id: semgrep
        if: hashFiles('.semgrep/propmind-conventions.yml') != ''
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          # Only report findings introduced by the PR (delta vs its base branch).
          # Pre-existing legacy violations stay quiet. The base comes from the PR
          # itself: `github.base_ref` is empty on `issue_comment`, which silently
          # turned the `/review` pre-pass into a no-op.
          semgrep --config .semgrep/propmind-conventions.yml \
            --baseline-commit "${{ steps.context.outputs.base_ref }}" \
            --json --output /tmp/semgrep.json \
            . || true

          if [ ! -f /tmp/semgrep.json ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "findings=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(jq '.results | length' /tmp/semgrep.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            FINDINGS=$(jq -r '.results[] | "- **`\(.path):\(.start.line)`** [`\(.check_id)` — \(.extra.severity)] — \(.extra.message | gsub("\n";" ") | .[:400])"' /tmp/semgrep.json)
            {
              echo "findings<<SG_EOF"
              echo "$FINDINGS"
              echo "SG_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "findings=" >> "$GITHUB_OUTPUT"
          fi

      # The agent only reads and judges. It has no tool that writes to GitHub:
      # it returns the review as structured output and the next step publishes
      # it. Publishing used to cost several turns per run (wrong tool name,
      # denied heredoc fallback, retries that re-sent the whole body).
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model ${{ steps.route.outputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --add-dir ${{ env.CONTEXT_DIR }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","COMMENT","REQUEST_CHANGES"]},"body":{"type":"string"}},"required":["verdict","body"],"additionalProperties":false}'
          prompt: |
            You are an experienced code reviewer for Propmind (Brazilian real estate SaaS).
            Review PR #${{ inputs.pr_number }} in repository ${{ github.repository }}. The PR head is checked out in the working directory.
            ${{ inputs.mode == 'comment' && format('Requested via /review by @{0}.', inputs.comment_author) || '' }}

            ## How to work

            Every turn re-reads everything gathered so far, so save turns by **batching**, never by skipping verification:
            - Issue independent tool calls together in one turn (several `Read`/`Grep` at once), never one by one.
            - Do trace what the change relies on: callers, the domain or ledger rules a computation must agree with, other modules that produce the same value. A cross-file inconsistency is the finding a diff-only reading misses.
            - Do not run tests, linters, type checkers or builds (`pytest`, `vitest`, `lint-imports`, `npm`, `uv run`); CI runs them and they are not available here. Use plain `git`, `Read`, `Grep` and `Glob` calls, without `cd` or pipes.
            - Nothing below needs a GitHub tool. You cannot publish; return the review as structured output and the workflow publishes it.

            **Turn 1 — read in one parallel batch:** `${{ env.CONTEXT_DIR }}/pr.md` (metadata, size, CI, commits, description), `${{ env.CONTEXT_DIR }}/discussion.md` (human comments and the previous automated review)${{ steps.context.outputs.diff_parts != '' && format(', and every diff part: {0} (all under {1})', steps.context.outputs.diff_parts, env.CONTEXT_DIR) || '' }}${{ steps.context.outputs.has_delta == 'true' && format(', and `{0}/delta-since-last-review.patch`', env.CONTEXT_DIR) || '' }}.

            Then look further only where the diff needs it: `Read` a file around a changed hunk, `Grep` a call site, `git log`/`git show` for intent. The base is `${{ steps.context.outputs.base_ref }}` (branch `${{ steps.context.outputs.base }}`); diff with `git diff ${{ steps.context.outputs.base_ref }}...HEAD -- <path>`.
            ${{ steps.context.outputs.has_delta == 'true' && format('
            **This is a re-review.** The bot already reviewed commit `{0}`. Concentrate on `delta-since-last-review.patch`; for the rest, carry forward the previous findings that still apply (check them against the current code) and drop the ones that were fixed or convincingly contested in the discussion. The verdict covers the whole PR.', steps.context.outputs.last_sha) || '' }}

            **Convention docs** (sole authority for violations — only flag rules documented there or in the rules below): ${{ inputs.convention_docs }}. They are long. `Grep` them for the area the diff touches and read only those sections.

            **Linear**: ${{ steps.linear.outputs.found == 'true' && 'the issue is inlined below — there is no Linear tool to call, and no other source. Use it for the Linear Alignment section.' || 'no issue was resolved for this branch. Write "No linked issue — review based on code only" in the Linear Alignment section, and do not present anything as an acceptance criterion. The PR description and the branch name remain valid context for intent — just never quoted as requirements.' }}

            **Batch size** by total lines changed: XS <50 / S 50–200 / M 200–500 / L 500–1000 (WARNING suggesting split) / XL 1000+ (batch size = main finding, defect detection ~28%).
            ${{ steps.linear.outputs.found == 'true' && format('
            ### Linked Linear issue

            {0}
            ', steps.linear.outputs.context) || '' }}

            ---

            ## Analyze${{ inputs.service_type != '' && format(' (Service type: **{0}**)', inputs.service_type) || '' }}

            **Strict finding contract — only emit findings that match:**

            - **CRITICAL** — security issues, data loss/corruption, broken API or contract, race conditions, bugs that will fail at runtime, missing auth on sensitive routes.
            - **WARNING** — likely bug or missing error handling with a clear path to failure in production, documented convention violation with concrete cost.

            **Do NOT emit findings for:**

            - Style, formatting, naming preferences, code aesthetics.
            - "I'd do it differently" — taste opinions without a concrete failure mode.
            - Theoretical/hypothetical issues with no realistic trigger.
            - Verbose suggestions, "nice to have", or refactor opportunities unrelated to the change.

            If the diff has no CRITICAL or WARNING findings that meet this bar, emit a clean APPROVE. A review that flags everything gets muted by devs in a week.

            Authoritative rules from `Propmind/.github/review-pr-rules/`:

            ${{ steps.rules.outputs.common }}

            ${{ steps.rules.outputs.project }}

            ### Risk-based file prioritization (L/XL only)

            ${{ steps.rules.outputs.large_pr }}
            ${{ steps.semgrep.outputs.count != '' && steps.semgrep.outputs.count != '0' && format('
            ### Deterministic findings (semgrep pre-pass)

            {0}

            **AUTHORITATIVE — include verbatim in `Findings`.** Severity: `propmind.backend.session-mutation-without-commit` → CRITICAL; others → use the listed severity. Do NOT re-emit these from your own analysis.', steps.semgrep.outputs.findings) || '' }}

            ---

            ## Report

            Format `body` using:

            ${{ steps.rules.outputs.templates }}

            `verdict`: any CRITICAL → `REQUEST_CHANGES` · WARNING only → `COMMENT` · neither → `APPROVE`.

            Return `{verdict, body}` as your final structured output. Do not try to post anything.

      - name: Publish review
        if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          VERDICT=$(printf '%s' "${STRUCTURED:-}" | jq -r '.verdict // empty' 2>/dev/null || true)
          printf '%s' "${STRUCTURED:-}" | jq -r '.body // empty' 2>/dev/null > /tmp/pr_review.md || true

          case "$VERDICT" in
            APPROVE|COMMENT|REQUEST_CHANGES) ;;
            *) VERDICT="" ;;
          esac

          if [ -z "$VERDICT" ] || [ ! -s /tmp/pr_review.md ]; then
            [ "${{ inputs.dry_run }}" = "true" ] || gh pr comment "$PR_NUMBER" -R "$REPO" --body \
              "⚠️ The automated review did not finish (no review was produced — likely the turn cap of ${{ inputs.max_turns }} or an API error). See the [run log]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID). Comment \`/review\` to try again." || true
            echo "::error::Reviewer returned no review (structured output missing or invalid)."
            exit 1
          fi

          # GitHub rejects review bodies above 65,536 characters.
          if [ "$(wc -c < /tmp/pr_review.md)" -gt 65000 ]; then
            head -c 64000 /tmp/pr_review.md > /tmp/pr_review.trunc
            printf '\n\n_(review truncated to fit GitHub limits)_\n' >> /tmp/pr_review.trunc
            mv /tmp/pr_review.trunc /tmp/pr_review.md
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            {
              echo "### Dry run — $VERDICT review for #$PR_NUMBER (not published)"
              echo
              cat /tmp/pr_review.md
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Dry run: $VERDICT review for #$PR_NUMBER written to the step summary."
            exit 0
          fi

          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --method POST \
            --field event="$VERDICT" --field "body=@/tmp/pr_review.md" > /dev/null

          # A new non-blocking verdict supersedes any blocking one the bot left
          # earlier; otherwise a stale CHANGES_REQUESTED stays until dismissed.
          if [ "$VERDICT" != "REQUEST_CHANGES" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq '.[] | select(.user.login | endswith("[bot]")) | select(.state == "CHANGES_REQUESTED") | .id' \
              | while read -r ID; do
                  gh api "repos/$REPO/pulls/$PR_NUMBER/reviews/$ID/dismissals" --method PUT \
                    --field message="Superseded by new automated review." > /dev/null || true
                done
          fi
          echo "::notice::Published $VERDICT review on #$PR_NUMBER."

      # One line per run with what it cost, so the next tuning round reads the
      # step summary instead of downloading logs.
      - name: Report usage
        if: ${{ !cancelled() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MODEL: ${{ steps.route.outputs.model }}
          SIZE: ${{ steps.context.outputs.size_lines }}
        run: |
          RESULT=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$EXECUTION_FILE" 2>/dev/null || echo '{}')
          TURNS=$(echo "$RESULT" | jq -r '.num_turns // "?"')
          COST=$(echo "$RESULT" | jq -r '(.total_cost_usd // 0) * 100 | round / 100')
          DENIALS=$(echo "$RESULT" | jq -r '(.permission_denials // []) | length')
          SUBTYPE=$(echo "$RESULT" | jq -r '.subtype // "?"')
          DENIED=$(echo "$RESULT" | jq -r '(.permission_denials // [])[] | "\(.tool_name): \((.tool_input.command // .tool_input.file_path // .tool_input.pattern // "") | tostring | .[0:80])"')
          echo "::notice::review-usage model=$MODEL size=$SIZE turns=$TURNS cost_usd=$COST denials=$DENIALS result=$SUBTYPE"
          {
            echo "### Review usage"
            echo
            echo "| Model | Size (lines) | Turns | Cost (USD) | Denied tool calls | Result |"
            echo "|---|---|---|---|---|---|"
            echo "| $MODEL | $SIZE | $TURNS | $COST | $DENIALS | $SUBTYPE |"
            if [ -n "$DENIED" ]; then
              echo
              echo "Denied tool calls:"
              echo
              while IFS= read -r D; do echo "- \`$D\`"; done <<< "$DENIED"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r D; do
            if [ -n "$D" ]; then echo "::notice::review-denied $D"; fi
          done <<< "$DENIED"
