name: PR Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
        description: "Pull request number to review"
      convention_docs:
        required: true
        type: string
        description: "Comma-separated list of convention doc paths to read (e.g., 'AGENTS.md,.github/copilot-instructions.md')"
      service_type:
        required: false
        type: string
        default: ""
        description: "Optional service type hint (e.g., python-fastapi, react-typescript). Agent infers from code if omitted."
      mode:
        required: false
        type: string
        default: "auto"
        description: "Review mode: 'auto' or 'comment'"
      comment_author:
        required: false
        type: string
        default: ""
        description: "GitHub username who requested the review (comment mode only)"
      model:
        required: false
        type: string
        default: "claude-sonnet-4-6"
        description: "Claude model to use for the review"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      LINEAR_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Route model by PR size
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Sonnet 4.6 is overkill for XS/S PRs (< 200 lines changed). Route
          # those to Haiku 4.5 (73% cheaper input). M+ PRs keep Sonnet —
          # they need the stronger reasoning for cross-file logic.
          # Caller can override by passing a non-default `model` input.
          STATS=$(gh pr view ${{ inputs.pr_number }} -R ${{ github.repository }} \
                    --json additions,deletions 2>/dev/null || echo '{"additions":0,"deletions":0}')
          ADDS=$(echo "$STATS" | jq -r '.additions // 0')
          DELS=$(echo "$STATS" | jq -r '.deletions // 0')
          TOTAL=$((ADDS + DELS))

          if [ "${{ inputs.model }}" != "claude-sonnet-4-6" ]; then
            # Caller explicitly chose a model — respect it.
            CHOSEN="${{ inputs.model }}"
            REASON="explicit caller override"
          elif [ "$TOTAL" -lt 200 ]; then
            CHOSEN="claude-haiku-4-5"
            REASON="XS/S size ($TOTAL lines) routed to Haiku"
          else
            CHOSEN="claude-sonnet-4-6"
            REASON="M+ size ($TOTAL lines) routed to Sonnet"
          fi

          echo "model=$CHOSEN" >> "$GITHUB_OUTPUT"
          echo "size_lines=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "🤖 Model: $CHOSEN — $REASON" >&2

      - name: Check Linear availability
        id: check-linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -n "$LINEAR_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Linear issue
        if: steps.check-linear.outputs.available == 'true'
        id: linear
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          # This used to start an MCP server from `@linear/mcp-server`, a package
          # that does not exist on npm. Every run logged `"linear": "failed"` and
          # the review's "Linear Alignment" section was written without the agent
          # ever having read the issue. One GraphQL call needs no package, no npx,
          # and no tool permission — and it either works or says so out loud.
          BRANCH=$(gh pr view "${{ inputs.pr_number }}" -R "${{ github.repository }}" \
                     --json headRefName --jq .headRefName)
          ISSUE_ID=$(printf '%s' "$BRANCH" \
                     | grep -oiE '[A-Za-z]{2,5}-[0-9]+' \
                     | head -1 | tr '[:lower:]' '[:upper:]' || true)

          if [ -z "$ISSUE_ID" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Linear identifier in branch '$BRANCH' — reviewing on code alone."
            exit 0
          fi

          # Look the issue up by team key + number rather than by `issue(id:)`,
          # which wants a UUID. `PMT-1666` → team `PMT`, number `1666`.
          TEAM_KEY=${ISSUE_ID%-*}
          ISSUE_NUM=${ISSUE_ID##*-}
          QUERY=$(jq -n --arg team "$TEAM_KEY" --argjson number "$ISSUE_NUM" '{
            query: "query($team:String!,$number:Float!){issues(filter:{team:{key:{eq:$team}},number:{eq:$number}},first:1){nodes{identifier title description url state{name}}}}",
            variables: {team: $team, number: $number}
          }')
          RESPONSE=$(curl -sS --max-time 30 -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$QUERY" || echo '{}')

          ISSUE=$(echo "$RESPONSE" | jq -c '.data.issues.nodes[0] // empty')
          if [ -z "$ISSUE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Linear lookup for $ISSUE_ID returned nothing: $(echo "$RESPONSE" | jq -rc '.errors // "no data"')"
            exit 0
          fi

          # Guard the heredoc sentinel: an issue description containing the
          # delimiter on its own line would otherwise forge workflow outputs.
          {
            echo "found=true"
            echo "context<<LINEAR_ISSUE_EOF"
            echo "$ISSUE" | jq -r '
              "**\(.identifier) — \(.title)** · state: \(.state.name) · \(.url)\n\n\(.description // "(no description)")"' \
              | { grep -vx 'LINEAR_ISSUE_EOF' || true; }
            echo "LINEAR_ISSUE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Linear $ISSUE_ID loaded."

      - name: Load review rules from Propmind/.github
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Map caller repo → project fragment
          case "$REPO" in
            Propmind/propmind-core) FRAGMENT="project-api" ;;
            Propmind/control-panel-ui) FRAGMENT="project-control-panel-ui" ;;
            Propmind/boleto-extractor) FRAGMENT="project-boleto-extractor" ;;
            Propmind/consumer-baas) FRAGMENT="project-consumer-baas" ;;
            Propmind/clicksign-worker) FRAGMENT="project-clicksign-worker" ;;
            *) FRAGMENT="" ;;
          esac

          fetch() {
            gh api "repos/Propmind/.github/contents/review-pr-rules/$1.md" \
              -H "Accept: application/vnd.github.raw"
          }

          COMMON=$(fetch common)
          TEMPLATES=$(fetch templates)
          LARGE_PR=$(fetch large-pr-prioritization)
          if [ -n "$FRAGMENT" ]; then
            PROJECT=$(fetch "$FRAGMENT")
          else
            PROJECT="(Unmapped project — apply common checklist only.)"
          fi

          {
            echo "common<<RULES_EOF"
            echo "$COMMON"
            echo "RULES_EOF"
            echo "templates<<RULES_EOF"
            echo "$TEMPLATES"
            echo "RULES_EOF"
            echo "large_pr<<RULES_EOF"
            echo "$LARGE_PR"
            echo "RULES_EOF"
            echo "project<<RULES_EOF"
            echo "$PROJECT"
            echo "RULES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run semgrep pre-pass
        id: semgrep
        if: hashFiles('.semgrep/propmind-conventions.yml') != ''
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          # Only report findings introduced by the PR (delta vs its base branch).
          # Pre-existing legacy violations stay quiet. Use the PR's base ref —
          # `main` in propmind-core, `develop` in control-panel-ui — so the
          # diff is against the right reference per repo's branching model.
          BASE_REF="${{ github.base_ref }}"
          semgrep --config .semgrep/propmind-conventions.yml \
            --baseline-commit "origin/${BASE_REF}" \
            --json --output /tmp/semgrep.json \
            . || true

          if [ ! -f /tmp/semgrep.json ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "findings=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(jq '.results | length' /tmp/semgrep.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            FINDINGS=$(jq -r '.results[] | "- **`\(.path):\(.start.line)`** [`\(.check_id)` — \(.extra.severity)] — \(.extra.message | gsub("\n";" ") | .[:400])"' /tmp/semgrep.json)
            {
              echo "findings<<SG_EOF"
              echo "$FINDINGS"
              echo "SG_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "findings=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect stale CHANGES_REQUESTED
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pre-check whether any bot-authored CHANGES_REQUESTED reviews are
          # active on this PR. If none, the dismiss step in Phase 3 is omitted
          # entirely from the prompt — saves tokens + turns on most reviews.
          HAS_STALE=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/reviews" \
            --jq '[.[] | select(.user.login | endswith("[bot]")) | select(.state == "CHANGES_REQUESTED")] | length' 2>/dev/null || echo "0")
          if [ "$HAS_STALE" -gt 0 ]; then
            echo "has_stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_stale=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          model: ${{ steps.route.outputs.model }}
          # Phase 0 asks for the four read tools below. They were absent here, so
          # every run burned turns on denied calls before falling back to `gh api`.
          allowed_tools: "mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_status,mcp__github__get_pull_request_reviews,mcp__github__create_pull_request_review,Bash(cat:*),Bash(gh api:*)"
          direct_prompt: |
            You are an experienced code reviewer for Propmind (Brazilian real estate SaaS).
            Review PR #${{ inputs.pr_number }} in repository ${{ github.repository }}.
            ${{ inputs.mode == 'comment' && format('Requested via /review by @{0}.', inputs.comment_author) || '' }}

            **Never `Read` a path under `/tmp/github-images/`.** Those files are staged
            by this action, not by the PR author — one of them is the action's own
            "Claude Code is working…" progress spinner, an animated GIF saved with a
            `.png` extension. Reading it sends a GIF declared as PNG to the API and the
            whole run dies on a 400. Nothing there is PR content; ignore every `<img>`
            pointing at that directory.

            ---

            ## Phase 0 — Detect Context

            Run in parallel:
            - `mcp__github__get_pull_request` — PR metadata
            - `mcp__github__get_pull_request_files` — changed files with patches
            - `mcp__github__get_pull_request_status` — CI status
            ${{ inputs.mode == 'comment' && '- `mcp__github__get_pull_request_reviews` — check existing reviews to avoid duplicates' || '' }}

            Extract Linear ID from branch with `[A-Za-z]{2,5}-\d+` (UPPERCASE). Ex: `fix/pmt-4-charges` → `PMT-4`.

            **Batch size** by total lines changed: XS <50 / S 50–200 / M 200–500 / L 500–1000 (WARNING suggesting split) / XL 1000+ (batch size = main finding, defect detection ~28%).

            **Read strategy:** `SINGLE_DIFF` for XS/S or ≤2 commits or messy commits · `PER_COMMIT` for M+ with 3+ well-structured commits.

            ---

            ## Phase 1 — Gather

            Run in parallel:
            - **Convention docs** (sole authority for violations — only flag rules documented here): ${{ inputs.convention_docs }}
            - **Linear**: ${{ steps.linear.outputs.found == 'true' && 'the issue is inlined below — there is no Linear tool to call, and no other source. Use it for the Linear Alignment section.' || 'no issue was resolved for this branch. Write "No linked issue — review based on code only" and do NOT infer acceptance criteria from the branch name or the PR body.' }}
            - **PR comments**: `gh api repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments` for author contests of prior findings.

            For L/XL PRs apply risk-based file prioritization (see below).
            For `PER_COMMIT`: read consolidated diff first; consult individual commits only when intent is ambiguous.
            ${{ steps.linear.outputs.found == 'true' && format('
            ### Linked Linear issue

            {0}
            ', steps.linear.outputs.context) || '' }}

            ---

            ## Phase 2 — Analyze${{ inputs.service_type != '' && format(' (Service type: **{0}**)', inputs.service_type) || '' }}

            **Strict finding contract — only emit findings that match:**

            - **CRITICAL** — security issues, data loss/corruption, broken API or contract, race conditions, bugs that will fail at runtime, missing auth on sensitive routes.
            - **WARNING** — likely bug or missing error handling with a clear path to failure in production, documented convention violation with concrete cost.

            **Do NOT emit findings for:**

            - Style, formatting, naming preferences, code aesthetics.
            - "I'd do it differently" — taste opinions without a concrete failure mode.
            - Theoretical/hypothetical issues with no realistic trigger.
            - Verbose suggestions, "nice to have", or refactor opportunities unrelated to the change.

            If the diff has no CRITICAL or WARNING findings that meet this bar, emit a clean APPROVE. A review that flags everything gets muted by devs in a week.

            Authoritative rules from `Propmind/.github/review-pr-rules/`:

            ${{ steps.rules.outputs.common }}

            ${{ steps.rules.outputs.project }}

            ### Risk-based file prioritization (L/XL only)

            ${{ steps.rules.outputs.large_pr }}
            ${{ steps.semgrep.outputs.count != '' && steps.semgrep.outputs.count != '0' && format('
            ### Deterministic findings (semgrep pre-pass)

            {0}

            **AUTHORITATIVE — include verbatim in `Findings`.** Severity: `propmind.backend.session-mutation-without-commit` → CRITICAL; others → use the listed severity. Do NOT re-emit these from your own analysis.', steps.semgrep.outputs.findings) || '' }}

            ---

            ## Phase 3 — Report and Publish

            Format using:

            ${{ steps.rules.outputs.templates }}

            Verdict: any CRITICAL → `REQUEST_CHANGES` · WARNING only → `COMMENT` · neither → `APPROVE`.

            **Publish — do NOT deviate:**

            1. Try `mcp__github__create_pull_request_review` with owner/repo from `${{ github.repository }}`, pull_number `${{ inputs.pr_number }}`, body, event.
            2. On body-size/escaping error: write body to `/tmp/pr_review.md` via `cat <<'REVIEW_EOF' > /tmp/pr_review.md` HEREDOC (quoted sentinel), then `gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/reviews --method POST --field event="<event>" --field "body=@/tmp/pr_review.md"`.
            3. On any further failure: **stop**, report the error verbatim. No `curl`, scripts, sub-agents, or other variants.
            ${{ steps.stale.outputs.has_stale == 'true' && format('
            **Dismiss stale CHANGES_REQUESTED.** This PR has a prior bot `CHANGES_REQUESTED` review still active. If your new verdict is `APPROVE` or `COMMENT`:
            1. Fetch reviews via `mcp__github__get_pull_request_reviews`.
            2. For each review where `user.login` ends with `[bot]` AND `state == "CHANGES_REQUESTED"`, dismiss it: `gh api repos/{0}/pulls/{1}/reviews/<review_id>/dismissals --method PUT --field message="Superseded by new automated review."` (one call per stale review).
            3. Skip dismissal if your verdict is `REQUEST_CHANGES`.', github.repository, inputs.pr_number) || '' }}

            Publish directly — no confirmation.
