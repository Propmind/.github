name: PR Review (Reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
        description: "Pull request number to review"
      convention_docs:
        required: true
        type: string
        description: "Comma-separated list of convention doc paths to read (e.g., 'AGENTS.md,.github/copilot-instructions.md')"
      service_type:
        required: false
        type: string
        default: ""
        description: "Optional service type hint (e.g., python-fastapi, react-typescript). Agent infers from code if omitted."
      mode:
        required: false
        type: string
        default: "auto"
        description: "Review mode: 'auto' or 'comment'"
      comment_author:
        required: false
        type: string
        default: ""
        description: "GitHub username who requested the review (comment mode only)"
      model:
        required: false
        type: string
        default: "claude-sonnet-4-6"
        description: "Claude model to use for the review"
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      LINEAR_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Linear availability
        id: check-linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -n "$LINEAR_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create MCP config
        if: steps.check-linear.outputs.available == 'true'
        id: mcp-config
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          CONFIG=$(python3 -c "
          import json, os
          config = {
            'mcpServers': {
              'linear': {
                'type': 'stdio',
                'command': 'npx',
                'args': ['-y', '@linear/mcp-server'],
                'env': {'LINEAR_API_KEY': os.environ['LINEAR_API_KEY']}
              }
            }
          }
          print(json.dumps(config))
          ")
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Load review rules from Propmind/.github
        id: rules
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Map caller repo → project fragment
          case "$REPO" in
            Propmind/propmind-core) FRAGMENT="project-api" ;;
            Propmind/control-panel-ui) FRAGMENT="project-control-panel-ui" ;;
            Propmind/boleto-extractor) FRAGMENT="project-boleto-extractor" ;;
            Propmind/consumer-baas) FRAGMENT="project-consumer-baas" ;;
            Propmind/clicksign-worker) FRAGMENT="project-clicksign-worker" ;;
            *) FRAGMENT="" ;;
          esac

          fetch() {
            gh api "repos/Propmind/.github/contents/review-pr-rules/$1.md" \
              -H "Accept: application/vnd.github.raw"
          }

          COMMON=$(fetch common)
          TEMPLATES=$(fetch templates)
          LARGE_PR=$(fetch large-pr-prioritization)
          if [ -n "$FRAGMENT" ]; then
            PROJECT=$(fetch "$FRAGMENT")
          else
            PROJECT="(Unmapped project — apply common checklist only.)"
          fi

          {
            echo "common<<RULES_EOF"
            echo "$COMMON"
            echo "RULES_EOF"
            echo "templates<<RULES_EOF"
            echo "$TEMPLATES"
            echo "RULES_EOF"
            echo "large_pr<<RULES_EOF"
            echo "$LARGE_PR"
            echo "RULES_EOF"
            echo "project<<RULES_EOF"
            echo "$PROJECT"
            echo "RULES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          model: ${{ inputs.model }}
          mcp_config: ${{ steps.check-linear.outputs.available == 'true' && steps.mcp-config.outputs.config || '' }}
          allowed_tools: "mcp__github__create_pull_request_review,Bash(cat:*),Bash(gh api:*)"
          direct_prompt: |
            You are an experienced code reviewer for Propmind (Brazilian real estate SaaS).

            Review the pull request identified in the "Run-specific context" block at the END of this prompt, following the 4-phase process below. The orchestration instructions and rule blocks are byte-identical across runs in the same repo to maximize prompt-cache reuse — keep this in mind when editing.

            ---

            ## Phase 0 — Detect Context

            Run in parallel:
            - `mcp__github__get_pull_request` — fetch PR metadata (title, body, base, head, author)
            - `mcp__github__get_pull_request_files` — list of changed files with patches
            - `mcp__github__get_pull_request_status` — CI status
            - If the run is in `comment` mode (see Run-specific context): also call `mcp__github__get_pull_request_reviews` to check existing reviews and avoid duplicating addressed findings.

            Extract Linear issue ID from branch name using pattern `[A-Za-z]{2,5}-\d+` (normalize to UPPERCASE).
            Examples: `fix/pmt-4-charges` → `PMT-4`, `PRO-219/feature` → `PRO-219`.

            **Batch size** — classify by total lines changed (additions + deletions):
            | Size | Lines | Action |
            |---|---|---|
            | XS | < 50 | No note |
            | S | 50–200 | No note |
            | M | 200–500 | Healthy range |
            | L | 500–1000 | Emit WARNING suggesting where to split |
            | XL | 1000+ | Make batch size the **main finding** — defect detection drops to ~28%; focus on how to decompose |

            **Read strategy:**
            - `SINGLE_DIFF` for XS/S or ≤ 2 commits
            - `PER_COMMIT` for M+ with 3+ well-structured commits
            - `SINGLE_DIFF + INFO` for messy commits

            ---

            ## Phase 1 — Gather

            Run in parallel:
            - **Convention docs**: read each path listed in "Convention docs" (see Run-specific context, comma-separated, relative to repo root). These are the **sole authority** for convention violations — only flag rules explicitly documented in these files.
            - **Linear context**: if a Linear ID was found, call `mcp__linear__linear_get_issue` with the identifier to get title, description, and acceptance criteria.
            - **PR discussion**: fetch the issue comments for this PR (via `mcp__github__get_pull_request` already includes comments, or use the issue comments endpoint with the PR number from Run-specific context) to extract author contests of prior findings.

            For L/XL PRs apply risk-based file prioritization (see "Risk-based file prioritization" in the rule blocks below).

            For `PER_COMMIT` strategy: read the consolidated diff first. Only inspect an individual commit when the consolidated diff has ambiguous intent for a hunk (e.g., adjacent additions and deletions that may be a refactor or a rewrite). Do not pre-read every commit before the consolidated.

            ---

            ## Phase 2 — Analyze

            Severity scale: **CRITICAL** (blocks merge) · **WARNING** (recommended fix) · **INFO** (suggestion)

            The authoritative review rules for this run are loaded from `Propmind/.github/review-pr-rules/`:

            ### Common rules

            ${{ steps.rules.outputs.common }}

            ### Project-specific rules

            ${{ steps.rules.outputs.project }}

            ### Risk-based file prioritization (apply when batch size is L or XL)

            ${{ steps.rules.outputs.large_pr }}

            ---

            ## Phase 3 — Report and Publish

            Format the review using the standard template defined in the loaded output templates:

            ${{ steps.rules.outputs.templates }}

            Verdict logic: any CRITICAL → `REQUEST_CHANGES` · no negatives → `APPROVE` · WARNING/INFO only → `COMMENT`

            **Publish using this deterministic sequence — do NOT deviate:**

            1. Try `mcp__github__create_pull_request_review` with:
               - `owner` and `repo` extracted from the repo identifier in Run-specific context
               - `pull_number`: the PR number from Run-specific context
               - `body`: the formatted review
               - `event`: `REQUEST_CHANGES` / `APPROVE` / `COMMENT` per verdict logic above
            2. If step 1 fails with a body-size or escaping error, write the body to `/tmp/pr_review.md` using a single `cat <<'REVIEW_EOF' > /tmp/pr_review.md` HEREDOC (quoted sentinel to prevent shell expansion), then publish via:
               ```
               gh api repos/<owner/repo>/pulls/<pr_number>/reviews \
                 --method POST \
                 --field event="<event>" \
                 --field "body=@/tmp/pr_review.md"
               ```
               substituting `<owner/repo>` and `<pr_number>` from Run-specific context.
            3. If step 2 also fails, **stop**. Report the error verbatim in your final message. Do **NOT** try `curl`, scripts, sub-agents, or any other tool variant. A failure to publish is acceptable; a retry storm is not.

            Do not ask for confirmation. Publish directly.

            ---

            ## Run-specific context

            - **Repository**: ${{ github.repository }}
            - **Pull request number**: ${{ inputs.pr_number }}
            - **Run mode**: ${{ inputs.mode }}${{ inputs.mode == 'comment' && format(' — review requested via /review comment by @{0}', inputs.comment_author) || '' }}
            - **Service type hint**: ${{ inputs.service_type != '' && inputs.service_type || '(none — infer from code)' }}
            - **Convention docs** (comma-separated paths from caller workflow):
              ${{ inputs.convention_docs }}
